name: Build Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "offline/**"
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true; & '{0}'"
    steps:
      - name: Stop if the offline version is frozen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          gh release view offline-final --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Offline version is frozen (release 'offline-final' exists). Nothing to build."
            "FROZEN=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0
          exit 0

      - uses: actions/checkout@v4
        if: env.FROZEN != '1'

      - uses: actions/setup-python@v5
        if: env.FROZEN != '1'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: env.FROZEN != '1'
        with:
          node-version: "20"

      - name: Read offline/build-settings.txt
        if: env.FROZEN != '1'
        run: |
          $s = @{ WEBSITE_URL = "https://YOUR-EASYBOOKS-SITE"; MONGODB_ZIP = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.14.zip" }
          if (Test-Path offline/build-settings.txt) {
            Get-Content offline/build-settings.txt | Where-Object { $_ -match '^[A-Z_]+=' } | ForEach-Object {
              $k, $v = $_ -split '=', 2
              if ($v.Trim()) { $s[$k] = $v.Trim() }
            }
          } else { Write-Warning "offline/build-settings.txt not found - using default settings" }
          foreach ($k in $s.Keys) { "$k=$($s[$k])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; Write-Host "$k=$($s[$k])" }
          "APP_VERSION=1.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check required files are in the repository
        if: env.FROZEN != '1'
        run: |
          $need = "frontend/package.json","backend/server.py","offline/server/offline_server.py","offline/server/requirements-offline.txt","offline/desktop/package.json","offline/desktop/main.js","offline/desktop/icon.ico"
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing from GitHub: $($missing -join ', ')"; exit 1 }

      - name: Restore yarn lock files (saved as .txt because yarn.lock is not uploaded)
        if: env.FROZEN != '1'
        run: |
          foreach ($p in @(@("offline/locks/frontend-yarn-lock.txt","frontend/yarn.lock"), @("offline/locks/desktop-yarn-lock.txt","offline/desktop/yarn.lock"))) {
            if (-not (Test-Path $p[1]) -and (Test-Path $p[0])) { Copy-Item $p[0] $p[1]; Write-Host "Restored $($p[1])" }
            elseif (-not (Test-Path $p[1])) { Write-Warning "$($p[1]) not found - installing latest matching versions" }
          }

      - name: Build the app screens (React)
        if: env.FROZEN != '1'
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8765
          REACT_APP_OFFLINE: "1"
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: |
          $env:REACT_APP_LICENCE_SERVER = $env:WEBSITE_URL
          yarn install --network-timeout 600000
          yarn build

      - name: Build the local server (Python)
        if: env.FROZEN != '1'
        working-directory: offline/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-offline.txt pyinstaller
          $mods = "erp_core","erp_sales","erp_purchase","erp_reports","final_accounts","eway","fa_tax","gstin","ca","accounting","auth","billing","business","db","emailer","gst","licensing","public","reminders","routes_admin","routes_ledgers","routes_reports","routes_vouchers","shop","stock","server","bcrypt","email_validator"
          $hidden = $mods | ForEach-Object { "--hidden-import"; $_ }
          pyinstaller --noconfirm --onedir --name easybooks-server --paths ../../backend --collect-all uvicorn --collect-submodules motor --collect-submodules pymongo --collect-submodules cryptography --copy-metadata razorpay @hidden offline_server.py

      - name: Add the MongoDB database engine
        if: env.FROZEN != '1'
        run: |
          Invoke-WebRequest $env:MONGODB_ZIP -OutFile mongo.zip
          Expand-Archive mongo.zip -DestinationPath mongo
          $bin = (Get-ChildItem mongo -Recurse -Filter mongod.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force offline/desktop/mongodb | Out-Null
          Get-ChildItem $bin -File | Where-Object { $_.Extension -ne ".pdb" -and $_.Name -notlike "mongos*" } | Copy-Item -Destination offline/desktop/mongodb

      - name: Make the one-click installer
        if: env.FROZEN != '1'
        working-directory: offline/desktop
        run: |
          yarn install --network-timeout 600000
          yarn electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$env:APP_VERSION"

      - name: Publish to GitHub Releases
        if: env.FROZEN != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-final
          name: Easy Books ${{ env.APP_VERSION }} (final offline version)
          body: Final one-click Windows installer for Easy Books offline, including CA multi-client access. Download EasyBooksSetup.exe and double-click it. This offline version is frozen; later updates are online only.
          files: offline/desktop/dist/EasyBooksSetup.exe
          make_latest: "true"
