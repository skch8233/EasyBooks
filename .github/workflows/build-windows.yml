name: Build Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "offline/**"
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OFFLINE_BASE: d55a42965bc0f7a201aed94f040aab2b439a353d
  OFFLINE_PATCH: offline/round15/side-menu-patch.txt

concurrency:
  group: windows-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true; & '{0}'"
    steps:
      - name: Stop if the offline version is frozen (push only; Run workflow always builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { Write-Host "Manual run: building a new offline-final release."; exit 0 }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "Could not list releases ($json) - building."; $global:LASTEXITCODE = 0; exit 0 }
          $done = ($json | ConvertFrom-Json) | Where-Object { -not $_.draft -and $_.tag_name -like "offline-final*" -and ($_.assets | Where-Object { $_.name -eq "EasyBooksSetup.exe" }) } | Select-Object -First 1
          if ($done) {
            Write-Host "Offline version is frozen: published release '$($done.tag_name)' has EasyBooksSetup.exe. Nothing to build."
            "FROZEN=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else { Write-Host "No published offline-final* release with EasyBooksSetup.exe - building." }
          $global:LASTEXITCODE = 0
          exit 0

      - uses: actions/checkout@v4
        if: env.FROZEN != '1'
        with:
          fetch-depth: 0

      - name: Use the exact offline-final-v1.0.14 code plus only the side-menu patch
        if: env.FROZEN != '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          $patch = "$env:RUNNER_TEMP/side-menu.patch"
          Copy-Item $env:OFFLINE_PATCH $patch
          git checkout --force --detach $env:OFFLINE_BASE
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not check out offline base $env:OFFLINE_BASE"; exit 1 }
          git apply --whitespace=nowarn $patch
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Side-menu patch does not apply to $env:OFFLINE_BASE"; exit 1 }
          git status --short
          $global:LASTEXITCODE = 0
          exit 0

      - uses: actions/setup-python@v5
        if: env.FROZEN != '1'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: env.FROZEN != '1'
        with:
          node-version: "20"

      - name: Read offline/build-settings.txt
        if: env.FROZEN != '1'
        run: |
          $s = @{ WEBSITE_URL = "https://YOUR-EASYBOOKS-SITE"; MONGODB_ZIP = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.14.zip" }
          if (Test-Path offline/build-settings.txt) {
            Get-Content offline/build-settings.txt | Where-Object { $_ -match '^[A-Z_]+=' } | ForEach-Object {
              $k, $v = $_ -split '=', 2
              if ($v.Trim()) { $s[$k] = $v.Trim() }
            }
          } else { Write-Warning "offline/build-settings.txt not found - using default settings" }
          foreach ($k in $s.Keys) { "$k=$($s[$k])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; Write-Host "$k=$($s[$k])" }
          "APP_VERSION=1.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check required files are in the repository
        if: env.FROZEN != '1'
        run: |
          $need = "frontend/package.json","backend/server.py","offline/server/offline_server.py","offline/server/requirements-offline.txt","offline/desktop/package.json","offline/desktop/main.js","offline/desktop/icon.ico"
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing from GitHub: $($missing -join ', ')"; exit 1 }

      - name: Restore yarn lock files (saved as .txt because yarn.lock is not uploaded)
        if: env.FROZEN != '1'
        run: |
          foreach ($p in @(@("offline/locks/frontend-yarn-lock.txt","frontend/yarn.lock"), @("offline/locks/desktop-yarn-lock.txt","offline/desktop/yarn.lock"))) {
            if (-not (Test-Path $p[1]) -and (Test-Path $p[0])) { Copy-Item $p[0] $p[1]; Write-Host "Restored $($p[1])" }
            elseif (-not (Test-Path $p[1])) { Write-Warning "$($p[1]) not found - installing latest matching versions" }
          }

      - name: Build the app screens (React)
        if: env.FROZEN != '1'
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8765
          REACT_APP_OFFLINE: "1"
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: |
          $env:REACT_APP_LICENCE_SERVER = $env:WEBSITE_URL
          yarn install --network-timeout 600000
          yarn build

      - name: Build the local server (Python)
        if: env.FROZEN != '1'
        working-directory: offline/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-offline.txt pyinstaller
          $mods = "erp_core","erp_sales","erp_purchase","erp_reports","final_accounts","eway","fa_tax","gstin","ca","accounting","auth","billing","business","db","emailer","gst","licensing","public","reminders","routes_admin","routes_ledgers","routes_reports","routes_vouchers","shop","stock","server","bcrypt","email_validator"
          $hidden = $mods | ForEach-Object { "--hidden-import"; $_ }
          pyinstaller --noconfirm --onedir --name easybooks-server --paths ../../backend --collect-all uvicorn --collect-submodules motor --collect-submodules pymongo --collect-submodules cryptography --copy-metadata razorpay @hidden offline_server.py

      - name: Add the MongoDB database engine
        if: env.FROZEN != '1'
        run: |
          Invoke-WebRequest $env:MONGODB_ZIP -OutFile mongo.zip
          Expand-Archive mongo.zip -DestinationPath mongo
          $bin = (Get-ChildItem mongo -Recurse -Filter mongod.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force offline/desktop/mongodb | Out-Null
          Get-ChildItem $bin -File | Where-Object { $_.Extension -ne ".pdb" -and $_.Name -notlike "mongos*" } | Copy-Item -Destination offline/desktop/mongodb

      - name: Make the one-click installer
        if: env.FROZEN != '1'
        working-directory: offline/desktop
        run: |
          yarn install --network-timeout 600000
          yarn electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$env:APP_VERSION"

      - name: Publish to GitHub Releases (new offline-final-v* tag, marked latest)
        if: env.FROZEN != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          $exe = "offline/desktop/dist/EasyBooksSetup.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem offline/desktop/dist -Filter *.exe | Where-Object { $_.Name -notlike "*uninstall*" } | Select-Object -First 1
            if (-not $found) { Write-Host "::error::Installer not found in offline/desktop/dist"; Get-ChildItem offline/desktop/dist | Format-Table Name, Length; exit 1 }
            Copy-Item $found.FullName $exe
          }
          Write-Host "Installer: $exe ($((Get-Item $exe).Length) bytes)"
          $tag = "offline-final-v$env:APP_VERSION"
          if ("$env:GITHUB_RUN_ATTEMPT" -ne "1") { $tag = "$tag-r$env:GITHUB_RUN_ATTEMPT" }
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { $tag = "$tag-$(Get-Date -Format yyyyMMddHHmmss)" }
          Write-Host "Publishing tag $tag on base commit $env:OFFLINE_BASE + side-menu patch (workflow commit $env:GITHUB_SHA)"
          $notes = "Final one-click Windows installer for Easy Books offline (version $env:APP_VERSION): offline-final-v1.0.14 plus the collapsible side menu (four groups with down/up arrows). Download EasyBooksSetup.exe and double-click it. This offline version is frozen; later updates are online only."
          $out = gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --target $env:OFFLINE_BASE --title "Easy Books $env:APP_VERSION (final offline version)" --notes $notes --latest 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release create failed for tag $tag : $out"
            Write-Host "Existing releases:"; gh release list --repo $env:GITHUB_REPOSITORY --limit 20
            exit 1
          }
          Write-Host $out
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,assets
          $global:LASTEXITCODE = 0
          exit 0
